name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 签名密钥从加密变量还原。未配置时跳过这一步，构建会自动回退到 debug 签名，
      # 保证没有配置密钥的仓库也能正常出包。
      - name: 还原签名密钥
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "未配置签名密钥，将使用 debug 签名出包"
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "签名密钥已还原"
          # 只打印长度，不打印内容——用于确认变量确实传进来了
          echo "keyAlias 长度=${#SIGNING_KEY_ALIAS} storePassword 长度=${#SIGNING_STORE_PASSWORD} keyPassword 长度=${#SIGNING_KEY_PASSWORD}"

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建
        run: ./gradlew assembleRelease --stacktrace

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: mic-control-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
