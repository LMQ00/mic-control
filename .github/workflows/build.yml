name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 签名密钥从加密变量还原。未配置时跳过这一步，构建会自动回退到 debug 签名，
      # 保证没有配置密钥的仓库也能正常出包。
      - name: 还原签名密钥
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "未配置签名密钥，将使用 debug 签名出包"
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "签名密钥已还原"

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # 先跑单元测试。音频缓冲这块逻辑一旦出错，现象是"队友听到噪音"
      # 或"放歌卡住"，现场很难查，所以在构建前先用测试把关。
      - name: 运行单元测试
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: 构建
        run: ./gradlew assembleRelease --stacktrace

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: mic-control-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 测试失败时把报告一并传上来，方便看是哪一条没过
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
